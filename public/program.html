<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Optimatika · Data Program Belajar</title>
  <!-- Bootstrap 5 & Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div class="d-flex flex-column flex-lg-row">
    <!-- 1. TEMPAT SIDEBAR OTOMATIS -->
    <div id="sidebar-container"></div>

    <!-- 2. KONTEN UTAMA HALAMAN -->
    <main class="main-wrapper flex-grow-1">
      
      <!-- TOP HEADER (Judul & Subjudul persis gambar) -->
      <div class="top-header">
        <div>
          <h1 class="page-title">Data Program Belajar</h1>
          <p class="page-subtitle" id="programSubtitle">Daftar program bimbingan belajar yang terdaftar di database Neon PostgreSQL.</p>
        </div>
      </div>

      <!-- CARD 1: FORM TAMBAH PROGRAM -->
      <div class="custom-card mb-4">
        <div class="card-heading">Tambah program</div>
        <form id="formAddProgram" onsubmit="event.preventDefault(); handleSimpanProgram();">
          <div class="row g-3 align-items-end">
            <!-- Nama program -->
            <div class="col-12 col-md-3">
              <label for="programName" class="form-label-custom">Nama program</label>
              <input type="text" class="form-control-custom" id="programName" placeholder="contoh: Matematika Dasar" required>
            </div>

            <!-- Jenjang -->
            <div class="col-12 col-md-3">
              <label for="programLevel" class="form-label-custom">Jenjang</label>
              <select class="form-select-custom" id="programLevel">
                <option value="SD" selected>SD</option>
                <option value="SMP">SMP</option>
                <option value="SMA">SMA</option>
              </select>
            </div>

            <!-- Pertemuan per bulan -->
            <div class="col-12 col-md-3">
              <label for="programSessions" class="form-label-custom">Pertemuan per bulan</label>
              <input type="number" class="form-control-custom" id="programSessions" value="8" min="1" max="31" required>
            </div>

            <!-- Tombol Simpan -->
            <div class="col-12 col-md-3">
              <button type="submit" class="btn-primary-custom w-100" id="btnSaveProgram">
                Simpan
              </button>
            </div>
          </div>
        </form>
      </div>

      <!-- CARD: TABEL DATA PROGRAM (Tampil & Hapus Data dari Database) -->
      <div class="custom-card p-0 overflow-hidden">
        <div class="table-responsive-custom">
          <table class="custom-table" id="tablePrograms">
            <thead>
              <tr>
                <th style="width: 45%;">PROGRAM</th>
                <th style="width: 25%;">JENJANG</th>
                <th style="width: 20%;">PERTEMUAN / BULAN</th>
                <th style="width: 10%; text-align: right; padding-right: 28px;"></th>
              </tr>
            </thead>
            <tbody id="programListBody">
              <!-- DATA_PROGRAM_START -->
              <tr>
                <td><strong>Calistung</strong></td>
                <td><span class="badge-level">SD</span></td>
                <td><span class="session-count">8×</span></td>
                <td class="text-end pe-4">
                  <button type="button" class="btn-delete-pill" onclick="hapusProgram(this, 'Calistung')">Hapus</button>
                </td>
              </tr>
              <tr>
                <td><strong>Matematika SD</strong></td>
                <td><span class="badge-level">SD</span></td>
                <td><span class="session-count">8×</span></td>
                <td class="text-end pe-4">
                  <button type="button" class="btn-delete-pill" onclick="hapusProgram(this, 'Matematika SD')">Hapus</button>
                </td>
              </tr>
              <tr>
                <td><strong>Memdongeng</strong></td>
                <td><span class="badge-level">SD</span></td>
                <td><span class="session-count">12×</span></td>
                <td class="text-end pe-4">
                  <button type="button" class="btn-delete-pill" onclick="hapusProgram(this, 'Memdongeng')">Hapus</button>
                </td>
              </tr>
              <!-- DATA_PROGRAM_END -->
            </tbody>
          </table>
        </div>
      </div>

    </main>
  </div>

  <!-- Panggil JavaScript Sidebar Reusable -->
  <script src="js/sidebar.js"></script>
  <script>
    renderSidebar('program');

    // 1. Fungsi pemicu hapus program dari database Neon PostgreSQL
    function hapusProgram(btn, namaProgram) {
      if (!confirm(`Yakin ingin menghapus program "${namaProgram}" dari database Neon?`)) {
        return;
      }

      // Kirim sinyal hapus ke database.py yang sedang standby
      fetch('http://localhost:8000/api/hapus?name=' + encodeURIComponent(namaProgram))
        .then(res => {
          if (!res.ok) throw new Error('Gagal menghubungi database.py');
          return res.json();
        })
        .then(data => {
          if (data.success) {
            // Hapus baris dari tabel di browser secara halus
            const tr = btn.closest('tr');
            if (tr) {
              tr.style.transition = 'all 0.3s ease';
              tr.style.opacity = '0';
              setTimeout(() => tr.remove(), 300);
            }
          } else {
            alert('Gagal menghapus: ' + (data.message || 'Terjadi kesalahan'));
          }
        })
        .catch(err => {
          alert('Pastikan file "python database.py standby" sedang berjalan di terminal!');
        });
    }

    // 2. Fungsi simpan program baru ke database Neon PostgreSQL
    function handleSimpanProgram() {
      const name = document.getElementById('programName').value.trim();
      const level = document.getElementById('programLevel').value;
      const sessions = document.getElementById('programSessions').value;

      if (!name) return;

      const btn = document.getElementById('btnSaveProgram');
      btn.disabled = true;
      btn.textContent = 'Menyimpan...';

      fetch(`http://localhost:8000/api/tambah?name=${encodeURIComponent(name)}&level=${encodeURIComponent(level)}&sessions=${encodeURIComponent(sessions)}`)
        .then(res => res.json())
        .then(data => {
          btn.disabled = false;
          btn.textContent = 'Simpan';
          if (data.success) {
            location.reload();
          } else {
            alert('Gagal menambah program: ' + data.error);
          }
        })
        .catch(err => {
          btn.disabled = false;
          btn.textContent = 'Simpan';
          alert('Pastikan file "python database.py standby" sedang berjalan di terminal!');
        });
    }

    // 3. Otomatis refresh tampilan saat kita beralih/klik kembali ke tab browser
    window.addEventListener('focus', () => {
      location.reload();
    });
  </script>
</body>
</html>
