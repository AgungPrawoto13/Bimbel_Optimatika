<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Optimatika · Data Program Belajar</title>
  <!-- Bootstrap 5 & Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div class="d-flex flex-column flex-lg-row">
    <!-- 1. TEMPAT SIDEBAR OTOMATIS -->
    <div id="sidebar-container"></div>

    <!-- 2. KONTEN UTAMA HALAMAN -->
    <main class="main-wrapper flex-grow-1">
      
      <!-- TOP HEADER (Judul & Subjudul persis gambar) -->
      <div class="top-header">
        <div>
          <h1 class="page-title">Data Program Belajar</h1>
          <p class="page-subtitle" id="programSubtitle">Daftar program bimbingan belajar yang terdaftar di database Neon PostgreSQL.</p>
        </div>
      </div>

      <!-- CARD: TABEL DATA PROGRAM (Tampil & Hapus Data dari Database) -->
      <div class="custom-card p-0 overflow-hidden">
        <div class="table-responsive-custom">
          <table class="custom-table" id="tablePrograms">
            <thead>
              <tr>
                <th style="width: 45%;">PROGRAM</th>
                <th style="width: 25%;">JENJANG</th>
                <th style="width: 20%;">PERTEMUAN / BULAN</th>
                <th style="width: 10%; text-align: right; padding-right: 28px;"></th>
              </tr>
            </thead>
            <tbody id="programListBody">
              <!-- DATA_PROGRAM_START -->
              <tr>
                <td><strong>Calistung</strong></td>
                <td><span class="badge-level">SD</span></td>
                <td><span class="session-count">8×</span></td>
                <td class="text-end pe-4 text-muted" style="font-size: 13px;">
                  <span class="badge bg-light text-secondary border">ID: 1</span>
                </td>
              </tr>
              <tr>
                <td><strong>Matematika SD</strong></td>
                <td><span class="badge-level">SD</span></td>
                <td><span class="session-count">8×</span></td>
                <td class="text-end pe-4 text-muted" style="font-size: 13px;">
                  <span class="badge bg-light text-secondary border">ID: 2</span>
                </td>
              </tr>
              <tr>
                <td><strong>Matematika SMP</strong></td>
                <td><span class="badge-level badge-smp">SMP</span></td>
                <td><span class="session-count">8×</span></td>
                <td class="text-end pe-4 text-muted" style="font-size: 13px;">
                  <span class="badge bg-light text-secondary border">ID: 3</span>
                </td>
              </tr>
              <!-- DATA_PROGRAM_END -->
            </tbody>
          </table>
        </div>
      </div>

    </main>
  </div>

  <!-- Panggil JavaScript Sidebar Reusable -->
  <script src="js/sidebar.js"></script>
  <script>
    renderSidebar('program');

    // Otomatis refresh tampilan saat kita beralih/klik kembali ke tab browser
    window.addEventListener('focus', () => {
      location.reload();
    });
  </script>
</body>
</html>
