<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Optimatika · Catat Pembayaran</title>
  <!-- Bootstrap 5 & Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="d-flex flex-column flex-lg-row">
  <!-- 1. TEMPAT SIDEBAR OTOMATIS -->
  <div id="sidebar-container"></div>

  <!-- 2. KONTEN UTAMA HALAMAN -->
  <main class="main-wrapper flex-grow-1">
    <div class="custom-card">
          <div class="card-heading">Tambah program</div>
          <form id="formAddProgram">
            <div class="row g-3 align-items-end">
              <!-- Nama program -->
              <div class="col-12 col-md-5">
                <label for="programName" class="form-label-custom">Nama program</label>
                <input type="text" class="form-control-custom" id="programName" placeholder="contoh: Matematika Dasar" required>
              </div>

              <!-- Jenjang -->
              <div class="col-12 col-md-3">
                <label for="programLevel" class="form-label-custom">Jenjang</label>
                <select class="form-select-custom" id="programLevel">
                  <option value="SD" selected>SD</option>
                  <option value="SMP">SMP</option>
                  <option value="SMA">SMA</option>
                  <option value="UMUM">UMUM / UTBK</option>
                </select>
              </div>

              <!-- Pertemuan per bulan -->
              <div class="col-12 col-md-2">
                <label for="programSessions" class="form-label-custom">Pertemuan per bulan</label>
                <input type="number" class="form-control-custom" id="programSessions" value="8" min="1" max="31" required>
              </div>

              <!-- Tombol Simpan -->
              <div class="col-12 col-md-2">
                <button type="submit" class="btn-primary-custom w-100" id="btnSaveProgram">
                  Simpan
                </button>
              </div>
            </div>
          </form>
    </div>

    <!-- Card 2: Tabel Program -->
    <div class="custom-card p-0 overflow-hidden">
      <div class="table-responsive-custom">
        <table class="custom-table" id="tablePrograms">
          <thead>
            <tr>
              <th style="width: 45%;">PROGRAM</th>
              <th style="width: 25%;">JENJANG</th>
              <th style="width: 20%;">PERTEMUAN / BULAN</th>
              <th style="width: 10%; text-align: right; padding-right: 28px;"></th>
            </tr>
          </thead>
          <tbody id="programListBody">
            <!-- Data akan dimuat otomatis oleh JavaScript dari Database Neon/SQLite -->
            <tr>
              <td><strong>Calistung</strong></td>
              <td><span class="badge-level">SD</span></td>
              <td><span class="session-count">8×</span></td>
              <td class="text-end pe-4"><button class="btn-delete-pill" onclick="handleDeleteProgram(1)">Hapus</button></td>
            </tr>
            <tr>
              <td><strong>Matematika SD</strong></td>
              <td><span class="badge-level">SD</span></td>
              <td><span class="session-count">8×</span></td>
              <td class="text-end pe-4"><button class="btn-delete-pill" onclick="handleDeleteProgram(2)">Hapus</button></td>
            </tr>
            <tr>
              <td><strong>Matematika SMP</strong></td>
              <td><span class="badge-level badge-smp">SMP</span></td>
              <td><span class="session-count">8×</span></td>
              <td class="text-end pe-4"><button class="btn-delete-pill" onclick="handleDeleteProgram(3)">Hapus</button></td>
            </tr>
            <tr>
              <td><strong>IPA Terpadu</strong></td>
              <td><span class="badge-level badge-smp">SMP</span></td>
              <td><span class="session-count">8×</span></td>
              <td class="text-end pe-4"><button class="btn-delete-pill" onclick="handleDeleteProgram(4)">Hapus</button></td>
            </tr>
            <tr>
              <td><strong>Persiapan UTBK</strong></td>
              <td><span class="badge-level badge-sma">SMA</span></td>
              <td><span class="session-count">12×</span></td>
              <td class="text-end pe-4"><button class="btn-delete-pill" onclick="handleDeleteProgram(5)">Hapus</button></td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>
</div>

  <!-- Panggil JavaScript Sidebar -->
  <script src="js/sidebar.js"></script>
  <script>
    // Panggil fungsi renderSidebar dengan nama menu yang aktif
    renderSidebar('program');
  </script>
</body>
</html>
