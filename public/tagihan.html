<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Optimatika · Terbitkan Tagihan</title>
  <!-- Bootstrap 5 & Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div class="d-flex flex-column flex-lg-row">
    <!-- 1. TEMPAT SIDEBAR OTOMATIS -->
    <div id="sidebar-container"></div>

    <!-- 2. KONTEN UTAMA HALAMAN -->
    <main class="main-wrapper flex-grow-1">
      
      <!-- TOP HEADER (Judul & Subjudul persis gambar) -->
      <div class="top-header">
        <div>
          <h1 class="page-title">Terbitkan Tagihan</h1>
          <p class="page-subtitle">Nominal diambil dari tarif program yang diikuti tiap siswa.</p>
        </div>
      </div>

      <!-- CARD 1: FORM PERIODE & TOMBOL TERBITKAN -->
      <div class="custom-card mb-4">
        <form onsubmit="event.preventDefault(); terbitkanTagihan();">
          <div class="row g-3 align-items-end">
            <!-- Pilihan Periode Tagihan -->
            <div class="col-12 col-md-7 col-lg-6">
              <label for="selectPeriode" class="form-label-custom">Periode tagihan</label>
              <select class="form-select-custom" id="selectPeriode" onchange="gantiPeriode()">
                <option value="Oktober 2026" selected>Oktober 2026</option>
                <option value="November 2026">November 2026</option>
                <option value="Desember 2026">Desember 2026</option>
              </select>
            </div>

            <!-- Tombol Terbitkan Untuk Semua Siswa -->
            <div class="col-12 col-md-auto">
              <button type="submit" class="btn-primary-custom" id="btnTerbitkan">
                Terbitkan untuk semua siswa
              </button>
            </div>
          </div>
        </form>
      </div>

      <!-- CARD 2: TABEL DAFTAR TAGIHAN PERIODE -->
      <div class="custom-card p-0 overflow-hidden">
        <div class="table-responsive-custom">
          <table class="custom-table" id="tableTagihan">
            <thead>
              <tr>
                <th style="width: 25%;">NO. TAGIHAN</th>
                <th style="width: 25%;">SISWA</th>
                <th style="width: 20%;">PROGRAM</th>
                <th style="width: 15%;">PERIODE</th>
                <th style="width: 15%; text-align: right; padding-right: 28px;">NOMINAL</th>
              </tr>
            </thead>
            <tbody id="tagihanListBody">
              <!-- DATA_TAGIHAN_START -->
              <tr id="emptyRow">
                <td colspan="5" class="text-center py-5 text-muted" style="font-size: 14.5px;">
                  Belum ada tagihan pada periode ini.
                </td>
              </tr>
              <!-- DATA_TAGIHAN_END -->
            </tbody>
          </table>
        </div>
      </div>

    </main>
  </div>

  <!-- Panggil JavaScript Sidebar Reusable -->
  <script src="js/sidebar.js"></script>
  <script>
    renderSidebar('tagihan');

    const API_BASE = (window.location.protocol === 'file:') ? 'http://localhost:8000' : '';

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text ?? '';
      return div.innerHTML;
    }

    function formatRupiah(nominal) {
      return 'Rp ' + Math.round(Number(nominal || 0)).toLocaleString('id-ID');
    }

    async function callApi(pathWithQuery) {
      let res = await fetch(`${API_BASE}${pathWithQuery}`);
      if (res.status === 404 && API_BASE === '' && !['8000', '8080'].includes(window.location.port)) {
        res = await fetch(`http://localhost:8000${pathWithQuery}`);
      }
      let data = null;
      try {
        data = await res.json();
      } catch (_) {
        data = null;
      }
      if (!res.ok) {
        if (res.status === 404) {
          throw new Error('HTTP 404: Endpoint tidak ditemukan. Jalankan ulang "python3 database.py standby" dan akses lewat http://localhost:8000/tagihan.html');
        }
        throw new Error((data && data.error) ? data.error : `HTTP ${res.status} (${res.statusText})`);
      }
      return data;
    }

    function renderTagihanTabel(bills, periode) {
      const tbody = document.getElementById('tagihanListBody');
      if (!bills || bills.length === 0) {
        tbody.innerHTML = `
          <tr id="emptyRow">
            <td colspan="5" class="text-center py-5 text-muted" style="font-size: 14.5px;">
              Belum ada tagihan pada periode ini.
            </td>
          </tr>
        `;
        return;
      }

      tbody.innerHTML = bills.map(b => {
        const badgeStatus = b.is_lunas
          ? '<span class="badge-status badge-status-lunas ms-2" style="font-size: 11px; padding: 2px 10px;">Sudah Bayar</span>'
          : '<span class="badge-status badge-status-belum ms-2" style="font-size: 11px; padding: 2px 10px;">Belum Bayar</span>';

        return `
          <tr>
            <td><code>${escapeHtml(b.invoice_no)}</code></td>
            <td><strong>${escapeHtml(b.student_name)}</strong>${badgeStatus}</td>
            <td>${escapeHtml(b.program_name)}</td>
            <td>${escapeHtml(b.period || periode)}</td>
            <td class="text-end pe-4"><strong>${formatRupiah(b.total_amount || b.amount)}</strong></td>
          </tr>
        `;
      }).join('');
    }

    async function gantiPeriode() {
      const periode = document.getElementById('selectPeriode').value;
      try {
        const data = await callApi(`/api/tagihan/list?periode=${encodeURIComponent(periode)}`);
        if (data && data.success) {
          renderTagihanTabel(data.bills, periode);
        }
      } catch (_) {
        // Fallback default
        renderTagihanTabel([], periode);
      }
    }

    async function terbitkanTagihan() {
      const periode = document.getElementById('selectPeriode').value;
      if (!confirm(`Apakah Anda yakin ingin menerbitkan tagihan untuk seluruh siswa aktif pada periode ${periode}?`)) {
        return;
      }

      try {
        const data = await callApi(`/api/tagihan/terbitkan?periode=${encodeURIComponent(periode)}`);
        if (data && data.success) {
          renderTagihanTabel(data.bills, periode);
          alert(`✅ Sukses! Tagihan periode ${periode} berhasil diterbitkan untuk ${data.bills.length} siswa aktif.`);
        }
      } catch (err) {
        alert(`Gagal menerbitkan tagihan:\n${err.message}`);
      }
    }

    document.addEventListener('DOMContentLoaded', gantiPeriode);
  </script>
</body>
</html>
