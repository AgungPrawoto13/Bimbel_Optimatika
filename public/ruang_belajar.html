<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Optimatika · Catat Pembayaran</title>
  <!-- Bootstrap 5 & Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="d-flex flex-column flex-lg-row">
  <!-- 1. TEMPAT SIDEBAR OTOMATIS -->
  <div id="sidebar-container"></div>

  <!-- 2. KONTEN UTAMA HALAMAN -->
  <main class="main-wrapper flex-grow-1">
    <div class="custom-card">
      <div class="card-heading">Tambah Ruang Belajar</div>
      <form id="formAddRoom">
        <div class="row g-3">
          <div class="col-md-4">
            <label class="form-label-custom">Nama Ruangan</label>
            <input type="text" class="form-control-custom" id="roomName" placeholder="Contoh: Ruang Delta (Lt. 2)" required>
          </div>
          <div class="col-md-2">
            <label class="form-label-custom">Kapasitas (Siswa)</label>
            <input type="number" class="form-control-custom" id="roomCapacity" value="10" required>
          </div>
          <div class="col-md-4">
            <label class="form-label-custom">Fasilitas</label>
            <input type="text" class="form-control-custom" id="roomFacilities" placeholder="AC, Smart TV, Whiteboard">
          </div>
          <div class="col-md-2 d-flex align-items-end">
            <button type="submit" class="btn-primary-custom w-100">Simpan Ruang</button>
          </div>
        </div>
      </form>
    </div>

    <div class="custom-card p-0 overflow-hidden">
      <div class="table-responsive-custom">
        <table class="custom-table">
          <thead>
            <tr>
              <th>NAMA RUANG</th>
              <th>KAPASITAS</th>
              <th>FASILITAS</th>
              <th class="text-end pe-4">AKSI</th>
            </tr>
          </thead>
          <tbody id="roomListBody">
            <!-- Dimuat dinamis -->
          </tbody>
        </table>
      </div>
    </div>
  </main>
</div>

  <!-- Panggil JavaScript Sidebar -->
  <script src="js/sidebar.js"></script>
  <script>
    // Panggil fungsi renderSidebar dengan nama menu yang aktif
    renderSidebar('ruang');
  </script>
</body>
</html>
