<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Optimatika · Catat Pembayaran</title>
  <!-- Bootstrap 5 & Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="d-flex flex-column flex-lg-row">
  <!-- 1. TEMPAT SIDEBAR OTOMATIS -->
  <div id="sidebar-container"></div>

  <!-- 2. KONTEN UTAMA HALAMAN -->
  <main class="main-wrapper flex-grow-1">
    <div class="custom-card">
          <div class="card-heading">Tambah Data Tutor</div>
          <form id="formAddTutor">
            <div class="row g-3">
              <div class="col-md-4">
                <label class="form-label-custom">Nama Tutor & Gelar</label>
                <input type="text" class="form-control-custom" id="tutorName" placeholder="Contoh: Kak Dedi, S.Mat." required>
              </div>
              <div class="col-md-3">
                <label class="form-label-custom">Bidang Keahlian / Mapel</label>
                <input type="text" class="form-control-custom" id="tutorSpecialty" placeholder="Contoh: Matematika Saintek" required>
              </div>
              <div class="col-md-3">
                <label class="form-label-custom">No. HP / WhatsApp</label>
                <input type="tel" class="form-control-custom" id="tutorPhone" placeholder="081299998888" required>
              </div>
              <div class="col-md-2 d-flex align-items-end">
                <button type="submit" class="btn-primary-custom w-100">Simpan Tutor</button>
              </div>
            </div>
          </form>
    </div>

    <div class="custom-card p-0 overflow-hidden">
      <div class="table-responsive-custom">
        <table class="custom-table">
          <thead>
            <tr>
              <th>NAMA TUTOR</th>
              <th>BIDANG MAPEL</th>
              <th>NO. KONTAK</th>
              <th>EMAIL</th>
              <th>STATUS</th>
              <th class="text-end pe-4">AKSI</th>
            </tr>
          </thead>
          <tbody id="tutorListBody">
            <!-- Dimuat dinamis -->
          </tbody>
        </table>
      </div>
    </div>
  </main>
</div>

  <!-- Panggil JavaScript Sidebar -->
  <script src="js/sidebar.js"></script>
  <script>
    // Panggil fungsi renderSidebar dengan nama menu yang aktif
    renderSidebar('tutor');
  </script>
</body>
</html>
