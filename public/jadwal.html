<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Optimatika · Catat Pembayaran</title>
  <!-- Bootstrap 5 & Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="d-flex flex-column flex-lg-row">
  <!-- 1. TEMPAT SIDEBAR OTOMATIS -->
  <div id="sidebar-container"></div>

  <!-- 2. KONTEN UTAMA HALAMAN -->
  <main class="main-wrapper flex-grow-1">
    <div class="custom-card">
      <div class="card-heading">Jadwal Sesi Bimbel</div>
      <div class="table-responsive-custom">
        <table class="custom-table">
          <thead>
            <tr>
              <th>HARI</th>
              <th>JAM</th>
              <th>KELOMPOK BELAJAR</th>
              <th>STATUS SESI</th>
            </tr>
          </thead>
          <tbody id="scheduleListBody">
            <tr>
              <td><strong>Senin & Rabu</strong></td>
              <td>15:30 - 17:00 WIB</td>
              <td>Kelas Reguler SD A</td>
              <td><span class="badge bg-success-subtle text-success px-3 py-2 rounded-pill">Berjalan Rutin</span></td>
            </tr>
            <tr>
              <td><strong>Selasa & Kamis</strong></td>
              <td>16:00 - 17:30 WIB</td>
              <td>Intensif SMP Juara</td>
              <td><span class="badge bg-success-subtle text-success px-3 py-2 rounded-pill">Berjalan Rutin</span></td>
            </tr>
            <tr>
              <td><strong>Sabtu & Minggu</strong></td>
              <td>09:00 - 12:00 WIB</td>
              <td>Intensif UTBK Saintek 1</td>
              <td><span class="badge bg-primary-subtle text-primary px-3 py-2 rounded-pill">Weekend Camp</span></td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>
</div>

  <!-- Panggil JavaScript Sidebar -->
  <script src="js/sidebar.js"></script>
  <script>
    // Panggil fungsi renderSidebar dengan nama menu yang aktif
    renderSidebar('jadwal');
  </script>
</body>
</html>
