<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Optimatika · Jadwal Belajar</title>
  <!-- Bootstrap 5 & Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div class="d-flex flex-column flex-lg-row">
    <!-- 1. TEMPAT SIDEBAR OTOMATIS -->
    <div id="sidebar-container"></div>

    <!-- 2. KONTEN UTAMA HALAMAN -->
    <main class="main-wrapper flex-grow-1">
      
      <!-- TOP HEADER (Judul & Subjudul Deteksi Bentrok) -->
      <div class="top-header">
        <div>
          <h1 class="page-title">Jadwal Belajar</h1>
          <p class="page-subtitle">Sebelum disimpan, sistem memeriksa bentrok ruang dan tutor pada hari yang sama.</p>
        </div>
      </div>

      <!-- CARD 1: FORM TAMBAH JADWAL -->
      <div class="custom-card mb-4">
        <div class="card-heading">Tambah jadwal</div>
        <form id="formAddSchedule" onsubmit="event.preventDefault(); handleSimpanJadwal();">
          <!-- Baris 1 Input (5 Kolom: Kelompok, Tutor, Ruang, Hari, Mulai) -->
          <div class="row row-cols-1 row-cols-md-5 g-3 mb-3">
            <!-- Kelompok -->
            <div class="col">
              <label for="selectKelompok" class="form-label-custom">Kelompok</label>
              <select class="form-select-custom" id="selectKelompok">
                <option value="Matematika SMP 1" selected>Matematika SMP 1</option>
                <option value="Calistung 1">Calistung 1</option>
                <option value="IPA Terpadu 1">IPA Terpadu 1</option>
              </select>
            </div>

            <!-- Tutor -->
            <div class="col">
              <label for="selectTutor" class="form-label-custom">Tutor</label>
              <select class="form-select-custom" id="selectTutor">
                <option value="Kak Rina" selected>Kak Rina</option>
                <option value="Kak Dewi">Kak Dewi</option>
                <option value="Kak Fajar">Kak Fajar</option>
                <option value="Kak Yoga">Kak Yoga</option>
              </select>
            </div>

            <!-- Ruang -->
            <div class="col">
              <label for="selectRuang" class="form-label-custom">Ruang</label>
              <select class="form-select-custom" id="selectRuang">
                <option value="Ruang A" selected>Ruang A</option>
                <option value="Ruang B">Ruang B</option>
                <option value="Ruang Privat">Ruang Privat</option>
              </select>
            </div>

            <!-- Hari -->
            <div class="col">
              <label for="selectHari" class="form-label-custom">Hari</label>
              <select class="form-select-custom" id="selectHari">
                <option value="Senin" selected>Senin</option>
                <option value="Selasa">Selasa</option>
                <option value="Rabu">Rabu</option>
                <option value="Kamis">Kamis</option>
                <option value="Jumat">Jumat</option>
                <option value="Sabtu">Sabtu</option>
                <option value="Minggu">Minggu</option>
              </select>
            </div>

            <!-- Jam Mulai -->
            <div class="col">
              <label for="timeMulai" class="form-label-custom">Mulai</label>
              <input type="time" class="form-control-custom" id="timeMulai" value="15:00" required>
            </div>
          </div>

          <!-- Baris 2 Input (Jam Selesai) -->
          <div class="row g-3 mb-3">
            <div class="col-12 col-md-2" style="max-width: 20%;">
              <label for="timeSelesai" class="form-label-custom">Selesai</label>
              <input type="time" class="form-control-custom" id="timeSelesai" value="16:30" required>
            </div>
          </div>

          <!-- Tombol Periksa dan Simpan (Berada di Bawah Selesai) -->
          <div>
            <button type="submit" class="btn-primary-custom" style="padding: 10px 28px;">
              Periksa dan simpan
            </button>
          </div>
        </form>
      </div>

      <!-- CARD 2: TABEL DATA JADWAL -->
      <div class="custom-card p-0 overflow-hidden">
        <div class="table-responsive-custom">
          <table class="custom-table" id="tableJadwal">
            <thead>
              <tr>
                <th style="width: 15%;">HARI</th>
                <th style="width: 20%;">WAKTU</th>
                <th style="width: 25%;">KELOMPOK</th>
                <th style="width: 20%;">TUTOR</th>
                <th style="width: 10%;">RUANG</th>
                <th style="width: 10%; text-align: right; padding-right: 28px;"></th>
              </tr>
            </thead>
            <tbody id="scheduleListBody">
              <!-- DATA_JADWAL_START -->
              <!-- Baris 1: Senin Matematika SMP 1 -->
              <tr data-hari="Senin" data-ruang="Ruang A" data-tutor="Kak Rina" data-waktu="15:00–16:30">
                <td><strong>Senin</strong></td>
                <td>15:00–16:30</td>
                <td>Matematika SMP 1</td>
                <td>Kak Rina</td>
                <td>Ruang A</td>
                <td class="text-end pe-4">
                  <button type="button" class="btn-delete-pill" onclick="hapusJadwal(this, 'Senin - Matematika SMP 1')">Hapus</button>
                </td>
              </tr>

              <!-- Baris 2: Senin Calistung 1 -->
              <tr data-hari="Senin" data-ruang="Ruang B" data-tutor="Kak Dewi" data-waktu="16:30–18:00">
                <td><strong>Senin</strong></td>
                <td>16:30–18:00</td>
                <td>Calistung 1</td>
                <td>Kak Dewi</td>
                <td>Ruang B</td>
                <td class="text-end pe-4">
                  <button type="button" class="btn-delete-pill" onclick="hapusJadwal(this, 'Senin - Calistung 1')">Hapus</button>
                </td>
              </tr>

              <!-- Baris 3: Rabu IPA Terpadu 1 -->
              <tr data-hari="Rabu" data-ruang="Ruang A" data-tutor="Kak Fajar" data-waktu="15:00–16:30">
                <td><strong>Rabu</strong></td>
                <td>15:00–16:30</td>
                <td>IPA Terpadu 1</td>
                <td>Kak Fajar</td>
                <td>Ruang A</td>
                <td class="text-end pe-4">
                  <button type="button" class="btn-delete-pill" onclick="hapusJadwal(this, 'Rabu - IPA Terpadu 1')">Hapus</button>
                </td>
              </tr>
              <!-- DATA_JADWAL_END -->
            </tbody>
          </table>
        </div>
      </div>

    </main>
  </div>

  <!-- Panggil JavaScript Sidebar Reusable -->
  <script src="js/sidebar.js"></script>
  <script>
    // 1. Aktifkan menu 'Jadwal' di sidebar
    renderSidebar('jadwal');

    const API_BASE = (window.location.protocol === 'file:') ? 'http://localhost:8000' : '';

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text ?? '';
      return div.innerHTML;
    }

    async function callApi(pathWithQuery) {
      let res = await fetch(`${API_BASE}${pathWithQuery}`);
      if (res.status === 404 && API_BASE === '' && !['8000', '8080'].includes(window.location.port)) {
        res = await fetch(`http://localhost:8000${pathWithQuery}`);
      }
      let data = null;
      try {
        data = await res.json();
      } catch (_) {
        data = null;
      }
      if (!res.ok) {
        if (res.status === 404) {
          throw new Error('HTTP 404: Endpoint /api/jadwal tidak ditemukan. Jalankan ulang "python3 database.py standby" dan buka via http://localhost:8000/jadwal.html');
        }
        throw new Error((data && data.error) ? data.error : `HTTP ${res.status} (${res.statusText})`);
      }
      return data;
    }

    function renderScheduleRows(schedules) {
      const tbody = document.getElementById('scheduleListBody');
      if (!schedules || schedules.length === 0) {
        tbody.innerHTML = '<tr><td colspan="6" class="text-center py-4 text-muted">Belum ada data jadwal di database Neon.</td></tr>';
        return;
      }

      tbody.innerHTML = schedules.map(s => {
        const waktu = `${s.start_time || ''}–${s.end_time || ''}`;
        const kelompok = s.program_name || s.group_name || '-';
        const tutor = s.tutor_name || '-';
        const ruang = s.room_name || '-';
        const jsInfo = `${s.day} - ${kelompok}`.replace(/\\/g, '\\\\').replace(/'/g, "\\'");

        return `
          <tr data-hari="${escapeHtml(s.day)}" data-ruang="${escapeHtml(ruang)}" data-tutor="${escapeHtml(tutor)}" data-waktu="${escapeHtml(waktu)}">
            <td><strong>${escapeHtml(s.day)}</strong></td>
            <td>${escapeHtml(waktu)}</td>
            <td>${escapeHtml(kelompok)}</td>
            <td>${escapeHtml(tutor)}</td>
            <td>${escapeHtml(ruang)}</td>
            <td class="text-end pe-4">
              <button type="button" class="btn-delete-pill" onclick="hapusJadwal(this, '${jsInfo}', ${Number(s.schedule_id)})">Hapus</button>
            </td>
          </tr>
        `;
      }).join('');
    }

    async function muatJadwalDariNeon() {
      try {
        const data = await callApi('/api/jadwal/list');
        if (!data || !data.success) return;

        const selKelompok = document.getElementById('selectKelompok');
        const selTutor = document.getElementById('selectTutor');
        const selRuang = document.getElementById('selectRuang');

        selKelompok.innerHTML = (data.programs || []).map(p =>
          `<option value="${Number(p.id)}">${escapeHtml(p.name)} (${escapeHtml(p.level)})</option>`
        ).join('') || '<option value="">Belum ada program</option>';

        selTutor.innerHTML = (data.tutors || []).map(t =>
          `<option value="${Number(t.id)}">${escapeHtml(t.name)}</option>`
        ).join('') || '<option value="">Belum ada tutor</option>';

        selRuang.innerHTML = (data.rooms || []).map(r =>
          `<option value="${Number(r.id)}">${escapeHtml(r.name)}</option>`
        ).join('') || '<option value="">Belum ada ruang</option>';

        renderScheduleRows(data.schedules || []);
      } catch (_) {
        // Fallback diam jika dibuka sebagai file statis tanpa server standby
      }
    }

    // 2. Fungsi Pemeriksaan Bentrok & Simpan Jadwal ke Neon PostgreSQL
    async function handleSimpanJadwal() {
      const programId = document.getElementById('selectKelompok').value;
      const tutorId = document.getElementById('selectTutor').value;
      const roomId = document.getElementById('selectRuang').value;
      const hari = document.getElementById('selectHari').value;
      const mulai = document.getElementById('timeMulai').value;
      const selesai = document.getElementById('timeSelesai').value;

      if (!programId || !tutorId || !roomId) {
        alert('Kelompok/Program, Tutor, dan Ruang wajib dipilih!');
        return;
      }

      if (!mulai || !selesai) {
        alert('Jam mulai dan selesai wajib diisi!');
        return;
      }

      if (mulai >= selesai) {
        alert('Jam selesai harus lebih akhir dari jam mulai!');
        return;
      }

      try {
        const params = new URLSearchParams({
          program_id: programId,
          tutor_id: tutorId,
          room_id: roomId,
          day: hari,
          start_time: mulai,
          end_time: selesai
        });
        await callApi(`/api/jadwal/tambah?${params.toString()}`);
        await muatJadwalDariNeon();
        alert(`✅ Berhasil! Tidak ada jadwal bentrok.\nJadwal (${hari}, ${mulai}–${selesai}) berhasil disimpan ke Neon PostgreSQL!`);
      } catch (err) {
        alert(`⚠️ ${err.message}`);
      }
    }

    // 3. Fungsi Hapus Jadwal dari Neon PostgreSQL
    async function hapusJadwal(buttonElement, infoJadwal, scheduleId) {
      if (!confirm(`Yakin ingin menghapus jadwal "${infoJadwal}" dari database Neon?`)) {
        return;
      }

      if (!scheduleId) {
        alert('Data jadwal ini belum tersinkron dengan ID database Neon. Pastikan server "python3 database.py standby" berjalan lalu refresh halaman.');
        return;
      }

      try {
        await callApi(`/api/jadwal/hapus?id=${encodeURIComponent(scheduleId)}`);
        await muatJadwalDariNeon();
      } catch (err) {
        alert(`Gagal menghapus jadwal dari Neon PostgreSQL:\n${err.message}`);
      }
    }

    document.addEventListener('DOMContentLoaded', muatJadwalDariNeon);
  </script>
</body>
</html>
