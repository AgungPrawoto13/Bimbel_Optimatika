<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Optimatika · Catat Pembayaran</title>
  <!-- Bootstrap 5 & Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="d-flex flex-column flex-lg-row">
  <!-- 1. TEMPAT SIDEBAR OTOMATIS -->
  <div id="sidebar-container"></div>

  <!-- 2. KONTEN UTAMA HALAMAN -->
  <main class="main-wrapper flex-grow-1">
    <div class="custom-card">
      <div class="card-heading">Kelompok Belajar Bimbel</div>
      <p class="text-muted mb-4">Pengelompokan siswa ke dalam kelas bimbingan terpadu.</p>
      <div class="table-responsive-custom">
        <table class="custom-table">
          <thead>
            <tr>
              <th>NAMA KELAS</th>
              <th>PROGRAM</th>
              <th>TUTOR PENGAMPU</th>
              <th>RUANGAN</th>
              <th class="text-end pe-4">AKSI</th>
            </tr>
          </thead>
          <tbody id="groupListBody">
            <tr>
              <td><strong>Kelas Reguler SD A</strong></td>
              <td><span class="badge-level">Matematika SD</span></td>
              <td>Kak Budi Santoso, S.Pd.</td>
              <td>Ruang Alpha (Lt. 1)</td>
              <td class="text-end pe-4"><button class="btn-delete-pill" onclick="Swal.fire('Info', 'Fitur kelas siap digunakan', 'info')">Detail</button></td>
            </tr>
            <tr>
              <td><strong>Intensif UTBK Saintek 1</strong></td>
              <td><span class="badge-level badge-sma">Persiapan UTBK</span></td>
              <td>Kak Rizky Pratama, S.Si.</td>
              <td>Ruang Gamma (Lt. 2)</td>
              <td class="text-end pe-4"><button class="btn-delete-pill" onclick="Swal.fire('Info', 'Fitur kelas siap digunakan', 'info')">Detail</button></td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>
</div>

  <!-- Panggil JavaScript Sidebar -->
  <script src="js/sidebar.js"></script>
  <script>
    // Panggil fungsi renderSidebar dengan nama menu yang aktif
    renderSidebar('kelompok');
  </script>
</body>
</html>
